<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>计算器 - 前后端分离</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- 左侧：计算器 -->
    <div class="calculator">
      <h2>计算器</h2>
      <!-- 显示区 -->
      <div class="display">
        <div class="expression" id="expression">0</div>
        <div class="result" id="result">= </div>
      </div>
      <!-- 错误提示 -->
      <div class="error" id="error"></div>
      <!-- 按钮区 -->
      <div class="keys">
        <button class="key danger" data-action="clear">C</button>
        <button class="key" data-value="(">(</button>
        <button class="key" data-value=")">)</button>
        <button class="key op" data-value="/">÷</button>

        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key op" data-value="*">×</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key op" data-value="-">−</button>

        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key op" data-value="+">+</button>

        <button class="key" data-value="0">0</button>
        <button class="key" data-value=".">.</button>
        <button class="key danger" data-action="backspace">⌫</button>
        <button class="key equal" data-action="calculate">=</button>
      </div>
    </div>

    <!-- 右侧：历史记录 -->
    <div class="history-panel">
      <div class="history-header">
        <h3>计算历史</h3>
        <button class="btn-clear-all" id="clearAllBtn">清空全部</button>
      </div>
      <div class="history-list" id="historyList">
        <div class="empty">暂无历史记录</div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
